name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v5 # ⚠️ 当前 Quartz 主线为 v5（稳定版仍可用 v4）

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 拉取完整历史，供 git 日期信息使用

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # 与本地 Node 22 兼容

      # 缓存 npm 依赖（加速构建）
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # 缓存 Quartz 社区插件
      - name: Cache Quartz plugins
        uses: actions/cache@v6
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - name: Install Dependencies
        run: npm ci

      # ⚠️ 关键：安装社区插件（官方文档要求）
      - name: Install Quartz plugins
        run: npx quartz plugin install
        # 如果有人会改 yaml 但不更新 lockfile，换成：
        # run: npx quartz plugin install --from-config

      - name: Build Quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
